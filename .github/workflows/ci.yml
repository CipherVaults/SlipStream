name: SlipStream CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  rust-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Ensure Tauri frontendDist placeholder exists
        run: New-Item -ItemType Directory -Force apps/desktop/dist | Out-Null
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --locked --workspace

  ts-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install workspace dependencies
        run: pnpm.cmd install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm.cmd -r typecheck
      - name: Test
        run: pnpm.cmd -r test
      - name: Build
        run: pnpm.cmd -r build
