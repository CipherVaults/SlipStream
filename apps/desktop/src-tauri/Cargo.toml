[package]
name = "slipstream-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "slipstream_desktop_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
slipstream-protocol = { path = "../../../crates/protocol" }
slipstream-engine = { path = "../../../crates/engine" }
slipstream-media = { path = "../../../crates/media" }
slipstream-torrent = { path = "../../../crates/torrent" }
slipstream-native-host = { path = "../../../crates/native-host" }
chrono.workspace = true
futures-util.workspace = true
hex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Graphics_Dwm",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows-core = "=0.62.2"
