[package]
name = "slipstream-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "slipstream_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
slipstream-protocol = { path = "../../../crates/protocol" }
slipstream-engine = { path = "../../../crates/engine" }
slipstream-media = { path = "../../../crates/media" }
slipstream-torrent = { path = "../../../crates/torrent" }
slipstream-native-host = { path = "../../../crates/native-host" }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
windows-sys.workspace = true
